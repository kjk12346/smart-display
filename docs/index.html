<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Display for Home Assistant</title>
  <!-- Home Assistant reads this page when the app signs in: the app's client_id is this page's URL, and this tag
       lists where Home Assistant may send the sign-in result. Keep it within the first 10 KB of the page. -->
  <link rel="redirect_uri" href="smartdisplay://auth-callback">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0d;
      color: #f6f5f3;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 32rem; padding: 2rem 1rem; }
    p { color: #a8a7ae; }
    .eyebrow { color: #7fd3e8; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">For Home Assistant</div>
    <h1>Smart Display</h1>
    <p>An Android app that turns a tablet into an always-on smart display for Home Assistant.</p>
    <p>This page identifies the app when it signs in to your Home Assistant. There's nothing to do here.</p>
  </main>
</body>
</html>
